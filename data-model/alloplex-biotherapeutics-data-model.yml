api: alloplex-biotherapeutics-content-api
summary: >-
  The entity-relationship graph of the Alloplex Biotherapeutics content API. It is the standard
  WordPress content model, narrowed to the anonymously readable subset. Two structural facts shape
  it: the `author` edge is unresolvable because /wp/v2/users is 401, and the four custom post types
  the sitemaps advertise (publication, team_member, conference, resource) are absent from the graph
  entirely because they are not REST-registered.
entities:
- name: Post
  collection: /wp/v2/posts
  count_observed: 61
  id_field: id
  id_type: integer
  schema: Post
  description: >-
    A press release, clinical or scientific news item, conference note, media-coverage entry or
    opinion piece. The primary content entity of this API and the only one with a populated body
    plus editorial classification.
  key_fields: [id, slug, date, modified, title.rendered, content.rendered, excerpt.rendered, link, categories, author, featured_media, status, type]
- name: Page
  collection: /wp/v2/pages
  count_observed: 19
  id_field: id
  id_type: integer
  schema: Page
  description: >-
    A corporate page — About, Investors, Scientists, Information for Patients, Media and Press,
    Media Kit, FAQ, Releases and Updates, Terms of use, Privacy Policy, Contact, and the
    shareholder-portal pages. All are top-level (parent 0) on this deployment, so the `parent`
    self-relationship exists in the schema but is unused.
  key_fields: [id, slug, date, modified, title.rendered, content.rendered, link, parent, menu_order, status, type]
- name: MediaItem
  collection: /wp/v2/media
  count_observed: 225
  id_field: id
  id_type: integer
  schema: MediaItem
  description: >-
    A media-library attachment — images plus PDF documents such as the company executive summary.
    `source_url` is the direct file URL and needs no further resolution.
  key_fields: [id, slug, media_type, mime_type, source_url, alt_text, post, media_details]
- name: Term
  collection: /wp/v2/categories, /wp/v2/tags
  count_observed: 11
  id_field: id
  id_type: integer
  schema: Term
  description: >-
    A taxonomy term. Eleven category terms carry the site's entire editorial grouping
    (company-news 16, conferences 19, scientific-news 17, opinion 13, diary-marker 13,
    media-coverage 12, clinical-news 11, research-news 5, backgrounder 4, audio-video 2,
    uncategorized 0). The post_tag taxonomy is registered but holds zero terms.
  key_fields: [id, name, slug, taxonomy, count, parent, link]
- name: PostType
  collection: /wp/v2/types
  count_observed: 12
  id_field: slug
  id_type: string
  schema: PostType
  description: Registry metadata describing each REST-registered post type and its rest_base.
- name: Taxonomy
  collection: /wp/v2/taxonomies
  count_observed: 4
  id_field: slug
  id_type: string
  schema: Taxonomy
  description: Registry metadata for category, post_tag, nav_menu and wp_pattern_category.
- name: PostStatus
  collection: /wp/v2/statuses
  count_observed: 2
  id_field: slug
  id_type: string
  schema: PostStatus
  description: Registry metadata for the statuses visible anonymously — publish and acf-disabled.
- name: SearchResult
  collection: /wp/v2/search
  id_field: id
  id_type: integer
  schema: SearchResult
  description: >-
    A projection, not a stored entity. Carries id, title (plain string, not a rendered object), url,
    type and subtype, with a _links.self pointing at the full Post or Page.
