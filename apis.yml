  x-contract-provenance: >-
    Derived by the API Evangelist enrichment pipeline from the WordPress REST route index the site
    publishes at https://alloplexbio.com/wp-json/ — 219 routes across the namespaces oembed/1.0,
    wpe/cache-plugin/v1, wpe_sign_on_plugin/v1, post-duplicator/v1, MtphrPostDuplicatorSettings/v1,
    rankmath/v1, wordfence/v1, mcp, wp/v2, wp-site-health/v1, wp-block-editor/v1 and
    wp-abilities/v1 — and verified against live anonymous responses on 2026-08-06. Only the
    operations that returned data without credentials are modelled. /wp/v2/users returns 401
    rest_forbidden, /wp/v2/settings returns 401 rest_forbidden, and menus, menu-items, templates,
    block-types, font-families, plugins, themes, widgets, sidebars and the pattern directory all
    return 401. The `mcp` and `wp-abilities/v1` namespaces are registered but return 401
    rest_forbidden on every route without credentials. Alloplex Biotherapeutics publishes no
    developer documentation, no API reference, no getting-started guide and no support channel for
    this surface, so no Documentation/APIReference/GettingStarted pointers are emitted; the
    humanURL above is the upstream WordPress REST handbook that defines the wp/v2 contract.
