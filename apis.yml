aid: alloplex-biotherapeutics
name: Alloplex Biotherapeutics
description: >-
  Alloplex Biotherapeutics, Inc. is a privately held clinical-stage cellular immunotherapy company
  founded in 2016 and headquartered in Woburn, Massachusetts, with a wholly owned subsidiary,
  Alloplex Australia Pty Ltd, in Adelaide, South Australia. It develops non-engineered, autologous
  multi-cellular therapies intended to retrain a patient's own immune system against solid tumors
  and autoimmune disease. Its ENLIST platform uses an irradiated, engineered melanoma cell line
  expressing multiple immunomodulatory factors to activate, differentiate and expand a patient's
  peripheral blood mononuclear cells; the resulting product, SUPLEXA, is manufactured by a defined,
  GMP-compatible process that uses no genetic engineering and no feeder cells and yields a full
  course of treatment from a small blood draw in roughly one month. The first-in-human Phase 1
  SUPLEXA-101 trial, conducted in Australia in 35 patients with metastatic solid tumors who had
  exhausted standard options, met its endpoints, and the FDA granted SUPLEXA Fast Track designation
  for MSI-H colorectal cancer. Alloplex Biotherapeutics runs no developer program and publishes no
  product API, developer portal, SDK or API documentation; the only machine-readable surface
  reachable without credentials is the WordPress REST content API behind alloplexbio.com,
  catalogued here.
