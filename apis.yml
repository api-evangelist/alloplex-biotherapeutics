x-coverage:
  state: covered
  reason: no-developer-program
  detail: >-
    Alloplex Biotherapeutics is a clinical-stage biotech that runs no developer program — /developers/,
    /api/ and every /.well-known/ path return 404 against a verified negative control — but its
    corporate WordPress site exposes a genuinely anonymous, machine-readable REST content API at
    /wp-json/ (61 posts, 19 pages, 225 media items, populated content bodies), which is what this
    profile catalogues; the site also registers a WordPress MCP adapter and the Abilities API, but
    both return 401 rest_forbidden anonymously so no agent surface is claimed.
  evidence:
  - url: https://alloplexbio.com/wp-json/
    status: 200
  - url: https://alloplexbio.com/wp-json/wp/v2/posts?per_page=1
    status: 200
  - url: https://alloplexbio.com/wp-json/mcp/mcp-adapter-default-server
    status: 401
