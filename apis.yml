apis:
- aid: alloplex-biotherapeutics:alloplex-biotherapeutics-content-api
  name: Alloplex Biotherapeutics Content API
  description: >-
    The anonymously readable WordPress REST API behind alloplexbio.com. It exposes the company's 61
    published press releases, scientific-news items and opinion pieces, the 19 corporate pages
    (About, Investors, Scientists, Information for Patients, Media and Press, Media Kit, FAQ,
    Releases and Updates, Terms of use, Privacy Policy, Contact and the shareholder-portal pages),
    the 225-item media library, the 11 editorial categories, the registered post types, taxonomies
    and statuses, cross-content search, and the oEmbed 1.0 provider endpoint. Unlike many corporate
    WordPress sites, `content.rendered` and `excerpt.rendered` are fully populated on posts and on
    most pages, so this surface yields real prose and not just identity and metadata. Three things a
    consumer must know. First, the `tags` taxonomy is registered but empty (0 terms) and comments
    are closed site-wide (0 items), so editorial grouping is carried entirely by `categories`.
    Second, the site registers four custom post types that appear in its sitemaps — `publication`,
    `team_member`, `conference` and `resource` — but none of them is REST-exposed, so publications,
    leadership bios, conference appearances and downloadable resources are reachable only as HTML,
    not through this API. Third, the site installs the WordPress MCP adapter (`mcp` namespace, a
    `POST /wp-json/mcp/mcp-adapter-default-server` endpoint) and the WordPress Abilities API
    (`wp-abilities/v1`), but every route under both returns 401 `rest_forbidden` anonymously, so no
    agent surface is claimed here. This is not a developer product Alloplex Biotherapeutics markets;
    it is the site's own content surface, registered at /wp-json/ and verified to return data
    without credentials. The OpenAPI in this repo is derived from the published route index.
  humanURL: https://developer.wordpress.org/rest-api/
  baseURL: https://alloplexbio.com/wp-json
